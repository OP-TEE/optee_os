%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/qcom,ramblur-pimem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Ramblur pIMEM controller

maintainers:
  - Selvam Sathappan Periakaruppan <selvam.periakaruppan@oss.qualcomm.com>

description:
  Memory protection controller of the pIMEM. Each of its four windows can
  protect a region of memory with confidentiality, integrity and anti-rollback.

properties:
  compatible:
    items:
      - const: qcom,sa8775p-ramblur-pimem
      - const: qcom,ramblur-pimem

  reg:
    maxItems: 1

  memory-region:
    maxItems: 1
    description:
      Reserved-memory region that the controller protects.

required:
  - compatible
  - reg
  - memory-region

additionalProperties: false

examples:
  - |
    reserved-memory {
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        trusted_apps_mem: trusted-apps@d1900000 {
            reg = <0xd1900000 0x1c00000>;
            no-map;
        };
    };

    pimem@610000 {
        compatible = "qcom,sa8775p-ramblur-pimem", "qcom,ramblur-pimem";
        reg = <0x610000 0x4000>;
        memory-region = <&trusted_apps_mem>;
        status = "disabled";
        secure-status = "okay";
    };
