name: Reusable QEMU checks image build

on:
  workflow_call:
    inputs:
      builder:
        required: true
        type: string
      target:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  QEMU_checks_image_build:
    name: Build
    runs-on: ${{ inputs.builder }}
    steps:
      - name: Free disk space if low
        run: |
          # Some hosted runners come with a 72 GB disk and less than 20 GB
          # free, which this job outgrows. Remove tools it doesn't use there.
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 40 ]; then
            echo "::notice::Only ${avail} GB free, removing unused preinstalled tools"
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache \
              /usr/share/swift /usr/local/.ghcup
            df -h /
          fi
      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM ghcr.io/${{ vars.CI_IMAGE_OWNER || 'op-tee' }}/optee_os/ci-build-image
          ARG MANIFEST_OWNER
          RUN /root/get_optee.sh ${{ inputs.target }} /root/optee_repo_qemu "$MANIFEST_OWNER"
          EOF
      - name: Build Docker image
        run: |
          docker build --build-arg MANIFEST_OWNER="${{ vars.MANIFEST_OWNER }}" -t ${{ inputs.tag }} .
          docker save ${{ inputs.tag }} | zstd -T0 -o ${{ inputs.tag }}.tar.zst
      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tag }}
          path: ${{ inputs.tag }}.tar.zst
          retention-days: 5
