name: CI Images
on: workflow_dispatch

permissions:
  contents: read

jobs:
  gen-ci-build-image:
    name: Generate CI Build Image
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a  # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      file: scripts/ci-images/Dockerfile.build
      meta-images: ghcr.io/${{ github.repository }}/ci-build-image
      meta-tags: type=raw,value=testing
      push: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  gen-ci-check-image:
    name: Generate CI Check Image
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a  # v1.17.0
    needs: gen-ci-build-image
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      file: scripts/ci-images/Dockerfile.check
      build-args: |
        CI_IMAGE_OWNER=${{ vars.CI_IMAGE_OWNER || 'op-tee' }}
        MANIFEST_OWNER=${{ vars.MANIFEST_OWNER || 'op-tee' }}
      meta-images: ghcr.io/${{ github.repository }}/ci-check-image
      meta-tags: type=raw,value=testing
      push: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  qualify-images:
    name: Qualify CI Images
    runs-on: ubuntu-26.04
    needs: gen-ci-check-image
    permissions:
      actions: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Perform Test Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW=$(gh workflow run ci.yml -r ${{ github.ref_name }} -f ci_image_tag=testing | grep "^https://github.com/")
          echo "Waiting for $WORKFLOW to complete..."
          gh run watch --exit-status -i 60 ${WORKFLOW##*/} > /dev/null
      - name: Registry Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag as latest
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create --tag "${IMAGE_BASE}/ci-build-image:latest" "${IMAGE_BASE}/ci-build-image:testing"
          docker buildx imagetools create --tag "${IMAGE_BASE}/ci-check-image:latest" "${IMAGE_BASE}/ci-check-image:testing"

  cleanup-ghcr-containers:
    name: cleanup untagged containers
    runs-on: ubuntu-26.04
    needs: qualify-images
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          dry-run: false
          validate: true
          delete-untagged: true
          delete-orphaned-images: true
          packages: ${{ github.event.repository.name }}/ci-build-image,${{ github.event.repository.name }}/ci-check-image
