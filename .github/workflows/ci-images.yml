name: CI Images
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}  # unique for this workflow
  cancel-in-progress: true

jobs:
  gen-ci-build-image:
    name: Generate CI Build Image
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a  # v1.17.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      platforms: linux/amd64,linux/arm64
      file: scripts/ci-images/Dockerfile.build
      meta-images: ghcr.io/${{ github.repository }}/ci-build-image
      meta-tags: type=raw,value=testing
      push: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  qualify-image:
    name: Qualify CI Image
    needs: gen-ci-build-image
    uses: ./.github/workflows/ci.yml
    with:
      ci_image_tag: testing

  tag-image:
    name: Tag CI Image
    runs-on: ubuntu-26.04
    needs: qualify-image
    permissions:
      packages: write
    steps:
      - name: Registry Login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag as latest
        shell: bash
        run: |
          IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "${IMAGE_BASE}/ci-build-image:latest" "${IMAGE_BASE}/ci-build-image:testing"

  cleanup-ghcr-containers:
    name: cleanup untagged containers
    runs-on: ubuntu-26.04
    needs: tag-image
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f  # v1.2.2
        with:
          dry-run: false
          validate: true
          delete-untagged: true
          delete-orphaned-images: true
          package: ${{ github.event.repository.name }}/ci-build-image
